<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>블록냥 시안 A · 리소 프린트</title>
<link rel="stylesheet" href="base.css">
<style>
  :root { --ink: #24201F; --paper: #F3EEE3; --paper2: #E9E2D4; --pink: #FF48B0; --blue: #0078BF; --yellow: #FFE800; --orange: #FF6C2F; --green: #00A95C; }
  body { background: #D9D3C7; color: var(--ink); }
  .sheet .desc { color: #6E675E; }
  .screen { background: var(--paper); color: var(--ink); box-shadow: 0 22px 40px -22px rgba(50,35,20,.45); }
  .grain { position: absolute; inset: 0; z-index: 9; pointer-events: none; mix-blend-mode: multiply; }
  .homebar { background: var(--ink); }

  .iconbtn, .coins, .menu .tile, .boost { background: var(--paper); border: 2.5px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); }
  .iconbtn { border-radius: 12px; }
  .coins { border-radius: 12px; }
  .coins .coin { background: var(--yellow); border: 2.5px solid var(--ink); position: relative; }
  .coins .coin::after { content: ""; position: absolute; inset: 4px; border: 1.6px solid var(--ink); border-radius: 50%; opacity: .55; }
  .coins .plus { background: var(--green); color: var(--paper); border: 2px solid var(--ink); border-radius: 8px; }
  .tagline { top: 222px; }
  .caption b { box-shadow: inset 0 -7px 0 var(--yellow); }

  .btn { border: 2.5px solid var(--ink); border-radius: 14px; box-shadow: 4px 4px 0 var(--ink); }
  .btn.primary { background: var(--yellow); }
  .btn.adv { background: var(--pink); }
  .btn.daily { background: var(--blue); color: var(--paper); }
  .btn.duel { background: var(--paper); }
  .blocks rect { stroke: var(--ink); stroke-width: 1.7; }
  .blocks .b1 { fill: var(--pink); } .blocks .b2 { fill: var(--blue); } .blocks .b3 { fill: var(--green); } .blocks .b4 { fill: var(--orange); }
  .menu .tile { border-radius: 13px; }
  .dot { width: 12px; height: 12px; background: var(--pink); border: 2px solid var(--ink); }
  .ad { border-top: 2.5px solid var(--ink); background: var(--paper2); }
  .adtag { background: var(--ink); color: var(--paper); }
  .adtext { color: #6B645B; }

  .best .ic { color: var(--orange); }
  .combo { background: var(--pink); border: 2.5px solid var(--ink); border-radius: 8px; transform: rotate(-4deg); box-shadow: 2px 2px 0 var(--ink); }
  .partner .track { stroke: var(--ink); stroke-width: 10; }
  .partner .prog { stroke: var(--pink); stroke-width: 5; }
  .partner .face { left: 14px; top: 14px; width: 54px; height: 54px; background: var(--yellow); border: 2.5px solid var(--ink); }
  .partner .face svg { margin: -4px 0 0 -4px; }
  .partner .skill { background: var(--blue); color: var(--paper); border: 2.5px solid var(--ink); }
  .partner .count { background: var(--paper); border: 2px solid var(--ink); border-radius: 6px; }

  .board { background: var(--ink); border-radius: 10px; padding: 4px; gap: 3px; box-shadow: 5px 5px 0 var(--ink); }
  .board .cell { border-radius: 2px; }
  .cell.c0 { background-color: var(--paper); }
  .cell.c1 { background-color: var(--pink); } .cell.c2 { background-color: var(--blue); } .cell.c3 { background-color: var(--yellow); }
  .cell.c4 { background-color: var(--orange); } .cell.c5 { background-color: var(--green); }
  .cell:not(.c0) { background-image: radial-gradient(circle, rgba(36,32,31,.26) 1.05px, transparent 1.35px); background-size: 4.5px 4.5px; }
  .slot { border: 2px dashed var(--ink); border-radius: 12px; }
  .piece .cell { border: 2px solid var(--ink); border-radius: 3px; }
  .boost { border-radius: 50%; }
  .boost .count { background: var(--pink); border: 2px solid var(--ink); color: var(--ink); }
</style>
</head>
<body>
<script src="mock.js"></script>
<script>
  const ink = '#24201F', cols = ['#0078BF', '#FF48B0', '#FF6C2F'];
  window.T = {
    title: 'A · 리소 프린트',
    desc: '형광 잉크로 찍은 인쇄물 느낌 — 종이 결, 굵은 먹선, 살짝 어긋난 판. 광택과 그라데이션은 쓰지 않음.',
    cat: 'riso',
    catColors: { fur: '#FF6C2F', pink: '#FF48B0', paper: '#F3EEE3', ink },
    tagline: 'BLOCK MEOW · 블록 퍼즐',
    defs: `<svg width="0" height="0" style="position:absolute"><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .14  0 0 0 0 .12  0 0 0 0 .1  0 0 0 .9 0"/></filter></svg>`,
    backdrop: `<svg class="grain" width="390" height="844"><rect width="390" height="844" filter="url(#grain)" opacity=".2"/></svg>`,
    logo: () => logoSVG({
      unit: 8, gap: 0, pad: 4,
      unitFn: (x, y, u, si) => `<rect x="${x + 2.2}" y="${y + 2.2}" width="${u}" height="${u}" fill="${ink}"/><rect x="${x}" y="${y}" width="${u}" height="${u}" fill="${cols[si]}"/>`,
    }),
  };
  render();
</script>
</body>
</html>
